<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>AutoMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white min-h-[100dvh] flex flex-col font-sans overflow-x-hidden antialiased selection:bg-[#ef4444] selection:text-white">

    <!-- Верхня панель (Navbar) -->
    <nav class="fixed w-full top-0 z-50 px-4 md:px-8 py-4 border-b border-white/5 bg-black/90 backdrop-blur-md supports-[backdrop-filter]:bg-black/70 pt-[env(safe-area-inset-top,0px)]">
        <div class="container mx-auto flex justify-between items-center h-10">
            <a href="#" onclick="showAllCars()" class="flex items-center gap-2 z-50 relative">
                <div class="bg-[#f97316] p-1.5 md:p-2 rounded-lg shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-car text-white text-sm md:text-base"></i>
                </div>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">Auto<span class="text-[#ef4444]">Market</span></h1>
            </a>
            
            <div class="hidden md:flex absolute left-1/2 transform -translate-x-1/2 items-center space-x-8 text-sm font-medium text-gray-300">
                <button onclick="showAllCars()" class="hover:text-white transition">Пошук</button>
                <button onclick="openAddCarModal()" class="hover:text-white transition">Продати авто</button>
            </div>

            <div id="authNavContainer" class="hidden md:flex items-center space-x-6 text-sm font-medium"></div>

            <button id="mobileMenuBtn" onclick="toggleMobileMenu()" class="md:hidden z-50 relative p-2 text-white hover:text-[#ef4444] transition-colors min-w-[44px] min-h-[44px] flex items-center justify-center">
                <i class="fa-solid fa-bars text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- Мобільне меню -->
    <div id="mobileNav" class="fixed inset-0 bg-black/98 z-40 hidden flex-col pt-[calc(80px+env(safe-area-inset-top,0px))] px-6 opacity-0 transition-opacity duration-300 overflow-y-auto">
        <div class="flex flex-col space-y-6 text-lg font-medium text-gray-300">
            <button onclick="showAllCars(); toggleMobileMenu();" class="text-left py-3 border-b border-white/5 hover:text-white">Пошук</button>
            <button onclick="openAddCarModal(); toggleMobileMenu();" class="text-left py-3 border-b border-white/5">Продати авто</button>
            <div id="mobileAuthNavContainer" class="flex flex-col space-y-6 pt-4"></div>
        </div>
    </div>

    <!-- Головний екран та Пошук -->
    <header class="relative pt-[calc(120px+env(safe-area-inset-top,0px))] pb-12 md:pb-24 px-4 min-h-[650px] flex flex-col justify-center border-b border-[#111111]">
        <div class="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=2069&auto=format&fit=crop')] bg-cover bg-center opacity-[0.2] mix-blend-luminosity grayscale"></div>
        <div class="absolute inset-0 z-0 bg-gradient-to-b from-black/80 via-black/60 to-black"></div>

        <div class="container mx-auto relative z-10 w-full max-w-5xl">
            <h2 class="text-4xl md:text-6xl lg:text-[4.5rem] font-extrabold mb-5 drop-shadow-2xl text-center tracking-tight text-white leading-[1.1]">
                Знайдіть свій <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#f97316] to-[#ef4444]">ідеальний</span><br>автомобіль
            </h2>
            <p class="text-gray-400 text-base md:text-lg lg:text-xl mb-10 md:mb-14 text-center font-light">
                Тисячі перевірених оголошень. Швидкий пошук. Безпечні угоди.
            </p>

            <!-- Мобільна кнопка фільтрів -->
            <button onclick="toggleFilters()" class="md:hidden w-full bg-[#111111] text-white py-4 rounded-xl mb-4 flex justify-center items-center gap-3 border border-white/10 active:bg-[#1a1a1a] transition min-h-[48px]">
                <i class="fa-solid fa-sliders"></i> Фільтри пошуку
            </button>

            <!-- Панель фільтрів -->
            <div id="filterPanel" class="fixed inset-0 bg-black/98 z-50 hidden md:block md:relative md:inset-auto md:bg-[#111111]/80 md:backdrop-blur-md p-5 md:p-6 rounded-none md:rounded-2xl md:border md:border-white/10 md:shadow-2xl mx-auto max-w-4xl overflow-y-auto md:overflow-visible opacity-0 md:opacity-100 transition-opacity duration-300 pb-[env(safe-area-inset-bottom,0px)] md:pb-6">
                <div class="flex justify-between items-center p-4 md:hidden border-b border-white/10 sticky top-0 bg-black pt-[env(safe-area-inset-top,0px)] z-10 mb-4">
                    <span class="text-lg font-bold">Фільтри</span>
                    <button onclick="toggleFilters()" class="p-2 text-gray-400 hover:text-white min-w-[44px] min-h-[44px]"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-4 px-4 md:px-0">
                    <div class="relative">
                        <select id="brandFilter" class="w-full p-4 md:p-3.5 bg-[#1a1a1a] border border-white/5 rounded-xl text-gray-300 outline-none focus:border-[#ef4444] appearance-none cursor-pointer">
                            <option value="">Марка</option>
                            <option value="BMW">BMW</option>
                            <option value="Audi">Audi</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Mercedes">Mercedes</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                    </div>
                    <div class="relative">
                        <select id="bodyFilter" class="w-full p-4 md:p-3.5 bg-[#1a1a1a] border border-white/5 rounded-xl text-gray-300 outline-none focus:border-[#ef4444] appearance-none cursor-pointer">
                            <option value="">Тип кузова</option>
                            <option value="Седан">Седан</option>
                            <option value="Позашляховик">Позашляховик</option>
                            <option value="Універсал">Універсал</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                    </div>
                    <input type="number" id="priceMin" placeholder="Ціна від" class="w-full p-4 md:p-3.5 bg-[#1a1a1a] border border-white/5 rounded-xl text-gray-300 outline-none focus:border-[#ef4444] placeholder-gray-500">
                    <input type="number" id="priceMax" placeholder="Ціна до" class="w-full p-4 md:p-3.5 bg-[#1a1a1a] border border-white/5 rounded-xl text-gray-300 outline-none focus:border-[#ef4444] placeholder-gray-500">
                </div>
                
                <div class="px-4 md:px-0 flex gap-2">
                    <button onclick="applyMobileFilters()" class="w-full bg-[#ef4444] py-4 rounded-xl text-white font-semibold hover:bg-red-600 transition active:scale-[0.99] shadow-lg flex items-center justify-center gap-2 text-base md:text-lg min-h-[56px]">
                        <i class="fa-solid fa-magnifying-glass"></i> Знайти автомобіль
                    </button>
                    <button onclick="clearFilters()" class="md:hidden px-6 bg-[#1a1a1a] border border-white/5 rounded-xl text-gray-400 hover:text-white transition active:bg-[#222] min-h-[56px]"><i class="fa-solid fa-eraser"></i></button>
                </div>
            </div>

            <!-- Статистика -->
            <div class="grid grid-cols-3 gap-2 md:gap-4 max-w-2xl mx-auto mt-14 md:mt-20 text-center" id="statistics">
                <div>
                    <div class="text-3xl md:text-4xl lg:text-5xl font-bold mb-1 md:mb-2 text-white"><span class="stat-number" data-target="15000">0</span>+</div>
                    <div class="text-gray-500 text-xs md:text-sm font-medium">Оголошень</div>
                </div>
                <div>
                    <div class="text-3xl md:text-4xl lg:text-5xl font-bold mb-1 md:mb-2 text-white"><span class="stat-number" data-target="50000">0</span>+</div>
                    <div class="text-gray-500 text-xs md:text-sm font-medium">Користувачів</div>
                </div>
                <div>
                    <div class="text-3xl md:text-4xl lg:text-5xl font-bold mb-1 md:mb-2 text-white"><span class="stat-number" data-target="1200">0</span>+</div>
                    <div class="text-gray-500 text-xs md:text-sm font-medium">Угод на місяць</div>
                </div>
            </div>

            <!-- Вкладки профілю -->
            <div id="userTabs" class="hidden justify-start md:justify-center gap-3 mt-10 overflow-x-auto pb-2 snap-x hide-scrollbar px-2 md:px-0">
                <button onclick="showAllCars()" class="snap-start whitespace-nowrap px-6 py-2 rounded-full bg-[#111111] border border-[#ef4444] text-white font-medium">Всі авто</button>
                <button onclick="showFavorites()" class="snap-start whitespace-nowrap px-6 py-2 rounded-full bg-[#111111]/50 border border-white/5 text-gray-400 hover:text-white font-medium">Обране</button>
                <button onclick="showMyAds()" class="snap-start whitespace-nowrap px-6 py-2 rounded-full bg-[#111111]/50 border border-white/5 text-gray-400 hover:text-white font-medium">Мої оголошення</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto py-8 md:py-12 px-4 flex-grow mb-[env(safe-area-inset-bottom,0px)]">
        <div id="carsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6"></div>
    </main>

    <!-- Модальні вікна залишені без змін в структурі, оновлені лише bg-[#1c212d] на bg-[#111111] і bg-[#0b0f19] на bg-black -->
    
    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/95 z-[60] hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300 pb-[env(safe-area-inset-bottom,0px)]">
        <div class="bg-[#111111] p-6 md:p-8 rounded-2xl w-full max-w-md border border-white/10 relative shadow-2xl max-h-[90dvh] overflow-y-auto">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-500 hover:text-[#ef4444] transition min-w-[44px] min-h-[44px] flex items-center justify-center"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 id="authTitle" class="text-2xl md:text-3xl font-bold mb-6 text-white text-center">Увійти</h3>
            <form id="authForm" onsubmit="submitAuth(event)" class="space-y-4">
                <div id="nameField" class="hidden space-y-1.5">
                    <label class="block text-sm text-gray-400 pl-1">Ім'я</label>
                    <input type="text" class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-sm text-gray-400 pl-1">Email</label>
                    <input type="email" required class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-sm text-gray-400 pl-1">Пароль</label>
                    <input type="password" required class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-[#ef4444] py-3.5 md:py-3 rounded-xl text-white font-bold hover:bg-red-600 active:scale-[0.98] transition mt-2 min-h-[48px]">Увійти</button>
            </form>
            <div class="mt-6 text-center text-sm text-gray-400">
                <span id="authSwitchText">Немає акаунта?</span> 
                <button onclick="toggleAuthMode()" id="authSwitchBtn" class="text-[#ef4444] hover:underline p-2">Зареєструватися</button>
            </div>
        </div>
    </div>

    <!-- Add Car Modal -->
    <div id="addCarModal" class="fixed inset-0 bg-black/95 z-[60] hidden items-center justify-center p-0 md:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-[#111111] h-full md:h-auto md:max-h-[90dvh] w-full max-w-2xl border-0 md:border md:border-white/10 md:rounded-2xl relative flex flex-col pt-[env(safe-area-inset-top,0px)] pb-[env(safe-area-inset-bottom,0px)] shadow-2xl">
            <div class="flex justify-between items-center p-4 md:p-6 border-b border-white/10 flex-shrink-0">
                <h3 id="addCarTitle" class="text-xl md:text-2xl font-bold text-white">Нове оголошення</h3>
                <button onclick="closeAddCarModal()" class="text-gray-500 hover:text-[#ef4444] transition min-w-[44px] min-h-[44px] flex items-center justify-center"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="overflow-y-auto p-4 md:p-6 flex-grow overscroll-contain">
                <form id="addCarForm" onsubmit="submitCar(event)" oninput="saveDraft()" class="space-y-5">
                    <input type="hidden" id="editCarId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="space-y-1.5">
                            <label class="block text-sm text-gray-400 pl-1">Марка <span class="text-[#ef4444]">*</span></label>
                            <div class="relative">
                                <select id="carBrand" required class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] appearance-none min-h-[48px]">
                                    <option value="BMW">BMW</option>
                                    <option value="Audi">Audi</option>
                                    <option value="Toyota">Toyota</option>
                                    <option value="Mercedes">Mercedes</option>
                                </select>
                                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm text-gray-400 pl-1">Модель <span class="text-[#ef4444]">*</span></label>
                            <input type="text" id="carModel" required placeholder="Наприклад: X5" class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm text-gray-400 pl-1">Рік <span class="text-[#ef4444]">*</span></label>
                            <input type="number" id="carYear" required min="1950" max="2026" class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm text-gray-400 pl-1">Ціна ($) <span class="text-[#ef4444]">*</span></label>
                            <input type="number" id="carPrice" required min="100" class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm text-gray-400 pl-1">Кузов <span class="text-[#ef4444]">*</span></label>
                            <div class="relative">
                                <select id="carBody" required class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] appearance-none min-h-[48px]">
                                    <option value="Седан">Седан</option>
                                    <option value="Позашляховик">Позашляховик</option>
                                    <option value="Універсал">Універсал</option>
                                </select>
                                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm text-gray-400 pl-1">Пробіг (тис. км) <span class="text-[#ef4444]">*</span></label>
                            <input type="number" id="carMileage" required min="0" class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-sm text-gray-400 pl-1">Опис</label>
                        <textarea id="carDesc" rows="4" class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] resize-none"></textarea>
                    </div>
                    <div class="space-y-1.5 pb-4">
                        <label class="block text-sm text-gray-400 pl-1">URL Фото</label>
                        <input type="url" id="carImg" placeholder="https://..." class="w-full p-3.5 md:p-3 bg-black border border-white/10 rounded-xl text-white outline-none focus:border-[#ef4444] min-h-[48px]">
                    </div>
                </form>
            </div>
            
            <div class="p-4 md:p-6 border-t border-white/10 flex flex-col md:flex-row gap-3 bg-[#111111] flex-shrink-0">
                <button type="button" onclick="clearDraft()" class="order-2 md:order-1 w-full md:w-1/3 bg-black border border-white/10 py-3.5 md:py-3 rounded-xl text-white hover:bg-[#1a1a1a] transition min-h-[48px]">Очистити</button>
                <button type="submit" form="addCarForm" id="submitCarBtn" class="order-1 md:order-2 w-full md:w-2/3 bg-[#ef4444] py-3.5 md:py-3 rounded-xl text-white font-bold hover:bg-red-600 active:scale-[0.98] transition min-h-[48px]">Опублікувати</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="fixed inset-0 bg-black/95 z-[60] hidden items-end md:items-center justify-center p-0 md:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-[#111111] w-full h-[85dvh] md:h-auto md:max-h-[90dvh] md:max-w-4xl border-t md:border border-white/10 rounded-t-2xl md:rounded-2xl flex flex-col md:flex-row overflow-hidden relative shadow-2xl pb-[env(safe-area-inset-bottom,0px)]">
            <button onclick="closeDetails()" class="absolute top-3 right-3 text-white bg-black/60 backdrop-blur-md p-2 rounded-full hover:text-[#ef4444] transition z-20 min-w-[40px] min-h-[40px] flex justify-center items-center"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="w-full md:w-1/2 h-64 md:h-auto flex-shrink-0 relative">
                <img id="detImg" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-[#111111] via-transparent to-transparent md:hidden"></div>
            </div>
            
            <div class="w-full md:w-1/2 p-5 md:p-8 flex flex-col overflow-y-auto overscroll-contain">
                <h3 id="detTitle" class="text-2xl md:text-3xl font-bold mb-1 text-white"></h3>
                <p class="text-3xl md:text-4xl font-black text-[#ef4444] mb-6" id="detPrice"></p>
                
                <div class="grid grid-cols-2 gap-y-4 text-sm text-gray-400 mb-6 bg-black p-4 rounded-xl border border-white/5">
                    <div>Рік: <span class="text-white font-medium block md:inline" id="detYear"></span></div>
                    <div>Кузов: <span class="text-white font-medium block md:inline" id="detBody"></span></div>
                    <div>Пробіг: <span class="text-white font-medium block md:inline" id="detMileage"></span> <span class="text-xs">тис. км</span></div>
                    <div>Власник: <span class="text-white font-medium block md:inline truncate" id="detOwner"></span></div>
                </div>
                
                <div class="mb-6 md:mb-8 flex-grow">
                    <p class="text-gray-400 text-sm mb-2 font-medium">Опис:</p>
                    <p class="text-gray-200 text-sm leading-relaxed" id="detDesc"></p>
                </div>

                <button class="w-full bg-[#ef4444] py-4 rounded-xl text-white font-bold hover:bg-red-600 active:scale-[0.98] transition mt-auto min-h-[48px] shadow-[0_0_20px_rgba(239,68,68,0.2)]" onclick="alert('У демо-версії ця функція вимкнена.')">
                    <i class="fa-solid fa-phone mr-2"></i> Зв'язатися
                </button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
